[package]
name = "dezoomify-core"
version = "2.20.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Pure discovery core for dezoomify-rs: describes zoomable image resources from supplied bytes without performing any I/O."
repository = "https://github.com/lovasoa/dezoomify-rs"
keywords = ["image", "download"]

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde-xml-rs = "0.8"
quick-xml = "0.42"
json5 = "1.3"
url = "2"
regex = "1"
memchr = "2"
custom_error = "1.7"
evalexpr = "13"
itertools = "0.15"
krpano-decrypt = "0.2"
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
aes = "0.9"
cbc = "0.2"
